name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apex_user
          POSTGRES_PASSWORD: apex_password
          POSTGRES_DB: apex_marketplace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U apex_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://apex_user:apex_password@localhost:5432/apex_marketplace
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npx prisma generate

      # Reports but doesn't block: the full lint run currently surfaces
      # ~270 pre-existing errors (mostly `any`-typed Prisma mocks in
      # *.service.spec.ts, predating this workflow) that are real but too
      # large to fold into adding CI. Drop continue-on-error once that
      # debt is paid down and this should gate merges like everything else.
      - run: npm run lint
        continue-on-error: true

      - run: npm run build

      - run: npm test

      - run: npx prisma migrate deploy

      - run: npm run test:e2e

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
