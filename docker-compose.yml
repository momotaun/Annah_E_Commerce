# None of the three services below set a fixed `container_name`: a hardcoded
# name collides the moment a second copy of this stack tries to start on the
# same Docker host (a second git worktree, a staging stack next to
# production, parallel CI runs) — the container name has to be unique
# host-wide, unlike the Compose project name. Compose's own default naming
# (`<project>-<service>-<n>`) is unique per project directory, and service
# names ("postgres", "backend", "frontend") still work for inter-container
# DNS on the Compose network regardless.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides whatever DATABASE_URL is in backend/.env — inside this
      # network the API must reach Postgres by service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time — must be reachable
        # from the browser, not the internal service name. The
        # http://localhost:3001/api default only works when the whole
        # stack runs on one local machine; a real deployment needs the
        # public API URL set here, e.g.
        # NEXT_PUBLIC_API_URL=https://api.example.com docker compose up -d --build
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    environment:
      # Runtime-only, used for server-side rendering inside this
      # container — reaches the API over the compose network.
      API_URL: http://backend:3001/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: