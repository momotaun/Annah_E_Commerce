services:
  - type: web
    name: apex-marketplace-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Paste the Neon (or other Postgres) connection string here after
      # creating the database — Render can't generate this one for you.
      - key: DATABASE_URL
        sync: false
      # Render generates a strong random value for these on first deploy —
      # nothing to fill in.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set once you know the deployed frontend URL (e.g. the Vercel
      # deployment) — required in production, used for CORS and
      # password-reset email links.
      - key: FRONTEND_URL
        sync: false
      # This service's own public URL, e.g. https://apex-marketplace-api.onrender.com
      - key: BACKEND_URL
        sync: false
      - key: DEFAULT_COMMISSION_RATE
        value: "10.00"
      - key: NODE_ENV
        value: production
