services:
  - type: web
    name: apex-marketplace-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Paste the Neon (or other Postgres) connection string here after
      # creating the database — Render can't generate this one for you.
      - key: DATABASE_URL
        sync: false
      # Render generates a strong random value for these on first deploy —
      # nothing to fill in.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # Set once you know the deployed frontend URL (e.g. the Vercel
      # deployment) — required in production, used for CORS and
      # password-reset email links.
      - key: FRONTEND_URL
        sync: false
      # This service's own public URL, e.g. https://apex-marketplace-api.onrender.com
      - key: BACKEND_URL
        sync: false
      - key: DEFAULT_COMMISSION_RATE
        value: "10.00"
      - key: NODE_ENV
        value: production

      # Which gateway handles new payments — "payfast" or "ozow". Both sets
      # of credentials can be set at once; webhooks for either always work
      # regardless of this setting.
      - key: PAYMENT_PROVIDER
        value: payfast

      # Ozow (https://ozow.com) — from your Ozow merchant dashboard.
      - key: OZOW_SITE_CODE
        sync: false
      - key: OZOW_PRIVATE_KEY
        sync: false
      - key: OZOW_API_KEY
        sync: false
      - key: OZOW_IS_TEST
        value: "true"

      # PayFast (https://payfast.co.za) — from your PayFast merchant
      # dashboard's Account Information page.
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      - key: PAYFAST_IS_TEST
        value: "true"

      # Resend (https://resend.com) transactional email — leave both unset
      # to fall back to ConsoleMailer (logs instead of sending).
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "EliteCommerce <onboarding@resend.dev>"

      # Object storage for vendor-uploaded product images — any
      # S3-compatible bucket (e.g. Neon Object Storage or AWS S3). Leave
      # unset to disable uploads (fails with a clear error instead of
      # crashing).
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_URL_BASE
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: "auto"
      - key: OBJECT_STORAGE_FORCE_PATH_STYLE
        value: "false"

      - key: LOG_LEVEL
        value: info
      # Optional — Sentry error tracking. Leave unset to disable.
      - key: SENTRY_DSN
        sync: false
