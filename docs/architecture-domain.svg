<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Apex Marketplace commerce domain relationships</title>
  <desc id="description">ER-style overview of marketplace users, vendors, categories, products, carts, orders, payments, vendor fulfilment, and commissions.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#62748a"/>
    </marker>
    <style>
      .bg{fill:#f4f7fb}.title{font:700 28px Arial,sans-serif;fill:#16263b}.subtitle{font:15px Arial,sans-serif;fill:#53657a}
      .box{fill:#fff;stroke:#9db0c5;stroke-width:1.5;rx:12}.user{fill:#eaf3ff;stroke:#4381c4;stroke-width:2}
      .commerce{fill:#eef8f3;stroke:#48a073;stroke-width:1.8}.vendor{fill:#fff7e8;stroke:#d69b34;stroke-width:1.8}
      .name{font:700 17px Arial,sans-serif;fill:#172b44}.detail{font:12px Arial,sans-serif;fill:#53657a}
      .line{fill:none;stroke:#62748a;stroke-width:1.8;marker-end:url(#arrow)}.label{font:12px Arial,sans-serif;fill:#52677e}
      .foot{font:13px Arial,sans-serif;fill:#53657a}
    </style>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text class="title" x="48" y="52">Apex Marketplace — Commerce Domain</text>
  <text class="subtitle" x="48" y="79">Simplified view of the principal Prisma entities and their cardinalities.</text>

  <rect class="user" x="55" y="145" width="190" height="105" rx="12"/>
  <text class="name" x="80" y="181">User</text>
  <text class="detail" x="80" y="205">Customer · Vendor · Admin</text>
  <text class="detail" x="80" y="226">Account, auth, addresses</text>

  <rect class="vendor" x="55" y="360" width="190" height="95" rx="12"/>
  <text class="name" x="80" y="396">Vendor</text>
  <text class="detail" x="80" y="420">Store profile and approval</text>
  <text class="detail" x="80" y="440">One user may own many stores</text>

  <rect class="commerce" x="355" y="125" width="195" height="90" rx="12"/>
  <text class="name" x="380" y="161">Category</text>
  <text class="detail" x="380" y="185">Recursive parent / child tree</text>
  <text class="detail" x="380" y="204">Fashion → audience → department → Size</text>

  <rect class="commerce" x="355" y="285" width="195" height="110" rx="12"/>
  <text class="name" x="380" y="321">Product</text>
  <text class="detail" x="380" y="345">SKU · price · stock · status</text>
  <text class="detail" x="380" y="366">Belongs to category + optional vendor</text>
  <text class="detail" x="380" y="385">Has options, reviews, images</text>

  <rect class="box" x="355" y="495" width="195" height="90" rx="12"/>
  <text class="name" x="380" y="531">ProductOption</text>
  <text class="detail" x="380" y="555">Color · Size · Storage</text>
  <text class="detail" x="380" y="575">Variant values for one product</text>

  <rect class="box" x="650" y="125" width="195" height="90" rx="12"/>
  <text class="name" x="675" y="161">Cart</text>
  <text class="detail" x="675" y="185">Guest session; optional user</text>
  <text class="detail" x="675" y="204">Contains cart items</text>

  <rect class="box" x="650" y="285" width="195" height="90" rx="12"/>
  <text class="name" x="675" y="321">Order</text>
  <text class="detail" x="675" y="345">Customer + shipping address</text>
  <text class="detail" x="675" y="365">Status and order total</text>

  <rect class="box" x="650" y="455" width="195" height="95" rx="12"/>
  <text class="name" x="675" y="491">OrderItem</text>
  <text class="detail" x="675" y="515">Product, quantity, price snapshot</text>
  <text class="detail" x="675" y="536">Part of one order</text>

  <rect class="box" x="920" y="125" width="220" height="90" rx="12"/>
  <text class="name" x="945" y="161">Address</text>
  <text class="detail" x="945" y="185">Owned by a user</text>
  <text class="detail" x="945" y="204">Used as order destination</text>

  <rect class="box" x="920" y="285" width="220" height="90" rx="12"/>
  <text class="name" x="945" y="321">Payment · Invoice</text>
  <text class="detail" x="945" y="345">Payments: one or more per order</text>
  <text class="detail" x="945" y="365">Invoice: zero or one per order</text>

  <rect class="vendor" x="920" y="455" width="220" height="95" rx="12"/>
  <text class="name" x="945" y="491">VendorOrderItem</text>
  <text class="detail" x="945" y="515">Vendor-specific fulfilment</text>
  <text class="detail" x="945" y="536">Tracks shipping and delivery</text>

  <rect class="vendor" x="920" y="610" width="220" height="80" rx="12"/>
  <text class="name" x="945" y="646">Commission</text>
  <text class="detail" x="945" y="670">Optional; one per vendor order item</text>

  <path class="line" d="M150 250V354"/><text class="label" x="161" y="310">owns 0..*</text>
  <path class="line" d="M245 190C295 190 295 340 350 340"/><text class="label" x="266" y="265">writes reviews</text>
  <path class="line" d="M245 405H350"/><text class="label" x="270" y="394">sells 0..*</text>
  <path class="line" d="M452 215V279"/><text class="label" x="463" y="250">contains 0..*</text>
  <path class="line" d="M452 395V489"/><text class="label" x="463" y="446">has options</text>
  <path class="line" d="M550 340C600 340 600 170 645 170"/><text class="label" x="565" y="240">via CartItem</text>
  <path class="line" d="M550 360H645"/><text class="label" x="567" y="350">via OrderItem</text>
  <path class="line" d="M747 215V279"/><text class="label" x="758" y="250">checkout</text>
  <path class="line" d="M747 375V449"/><text class="label" x="758" y="418">contains 1..*</text>
  <path class="line" d="M845 170H914"/><text class="label" x="855" y="159">customer</text>
  <path class="line" d="M845 320H914"/><text class="label" x="854" y="309">has 0..*</text>
  <path class="line" d="M845 340C880 370 880 500 914 500"/><text class="label" x="855" y="420">split by vendor</text>
  <path class="line" d="M1030 550V604"/><text class="label" x="1041" y="582">earns</text>
  <path class="line" d="M550 315C690 235 800 260 914 315"/><text class="label" x="720" y="245">product referenced by order item</text>
  <path class="line" d="M245 175C500 80 740 80 914 160"/><text class="label" x="640" y="105">user address</text>

  <text class="foot" x="55" y="724">CartItem, WishlistItem, and Review are join records. Other models include auth tokens, push tokens, return requests, site settings, hero slides, and legal pages.</text>
</svg>
